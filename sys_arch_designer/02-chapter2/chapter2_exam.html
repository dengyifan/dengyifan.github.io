<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>系统架构设计师 · 第2章 计算机系统基础知识 · 在线自测</title>
<style>
  :root{
    --primary:#2563eb; --primary-dark:#1d4ed8;
    --ok:#16a34a; --bad:#dc2626;
    --border:#e5e7eb; --muted:#6b7280;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0}
  button,a{touch-action:manipulation}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#f1f5f9;color:#1f2937;line-height:1.65;font-size:15px;
  }
  .hidden{display:none !important}

  /* ===== 顶部栏 ===== */
  .topbar{
    position:sticky;top:0;z-index:100;
    padding-top:env(safe-area-inset-top);
    background:rgba(255,255,255,.95);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:760px;margin:0 auto;padding:10px 16px;
    display:flex;align-items:center;gap:12px;
  }
  .brand{
    display:block;min-width:0;flex:1;
    color:inherit;text-decoration:none;
  }
  .brand-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-back{color:var(--primary);margin-right:5px;font-weight:700}
  .brand:active .brand-title{opacity:.6}
  .brand-sub{font-size:12px;color:var(--muted)}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .progress-bar{width:100px;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden}
  .progress-fill{height:100%;width:0;background:var(--primary);transition:width .25s}
  .progress-text{font-size:12px;color:var(--muted);white-space:nowrap}

  /* ===== 主容器 ===== */
  .container{max-width:760px;margin:0 auto;padding:20px 16px calc(100px + env(safe-area-inset-bottom))}

  /* ===== 题目卡片 ===== */
  .q-card{
    background:#fff;border-radius:14px;padding:22px;
    box-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  }
  .q-card.anim{animation:cardIn .28s ease}
  @keyframes cardIn{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
  }
  .q-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .q-badge{
    background:#dbeafe;color:#1d4ed8;
    font-size:13px;font-weight:700;
    padding:3px 10px;border-radius:20px;
  }
  .q-tag{font-size:11px;color:var(--muted);border:1px solid var(--border);padding:1px 6px;border-radius:4px}
  .q-stem{font-size:16px;font-weight:500;margin-bottom:16px;line-height:1.6}

  .options{display:flex;flex-direction:column;gap:9px}
  .option{
    display:flex;align-items:flex-start;gap:10px;
    width:100%;text-align:left;
    background:#f9fafb;border:1.5px solid var(--border);
    border-radius:10px;padding:11px 13px;
    cursor:pointer;font:inherit;font-size:14.5px;color:#1f2937;
    transition:background .15s,border-color .15s;
  }
  .option:hover{background:#eff6ff;border-color:#bfdbfe}
  .option.correct{background:#dcfce7;border-color:var(--ok)}
  .option.wrong{background:#fee2e2;border-color:var(--bad)}

  .opt-letter{
    flex:0 0 22px;height:22px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    background:#e5e7eb;color:#4b5563;font-size:12px;font-weight:700;
  }
  .option.correct .opt-letter{background:var(--ok);color:#fff}
  .option.wrong .opt-letter{background:var(--bad);color:#fff}

  .feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:13.5px}
  .feedback.ok{background:#f0fdf4;border-left:4px solid var(--ok)}
  .feedback.bad{background:#fef2f2;border-left:4px solid var(--bad)}
  .feedback-title{font-weight:700;margin-bottom:4px}
  .feedback-analysis{margin-top:6px;color:#374151;font-size:13px;line-height:1.7;white-space:pre-wrap}

  /* ===== 底部导航 ===== */
  .nav-bar{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:18px;gap:10px;
  }
  .nav-btn{
    border:1.5px solid var(--border);background:#fff;
    padding:10px 18px;border-radius:10px;
    font:inherit;font-size:14px;font-weight:500;
    cursor:pointer;transition:all .15s;color:#374151;
    white-space:nowrap;
  }
  .nav-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed}
  .nav-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .nav-btn.primary:hover{background:var(--primary-dark)}
  .nav-index{font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}

  /* ===== 结果页 ===== */
  .result-card{
    background:linear-gradient(135deg,#2563eb,#1e40af);
    color:#fff;border-radius:16px;padding:28px 20px;
    text-align:center;
    box-shadow:0 8px 24px rgba(37,99,235,.25);
  }
  .score-ring{display:inline-flex;align-items:baseline;gap:4px;margin-bottom:6px}
  .score-num{font-size:56px;font-weight:800;line-height:1}
  .score-unit{font-size:18px;opacity:.85}
  .result-level{font-size:16px;font-weight:600;opacity:.95}
  .result-stats{
    display:flex;justify-content:center;gap:32px;
    margin-top:20px;padding-top:18px;
    border-top:1px solid rgba(255,255,255,.2);
  }
  .stat{display:flex;flex-direction:column;align-items:center;gap:2px}
  .stat-num{font-size:24px;font-weight:700}
  .stat-num.ok{color:#86efac}
  .stat-num.bad{color:#fca5a5}
  .stat-num.muted{color:#cbd5e1}
  .stat-label{font-size:12px;opacity:.8}

  .result-section{
    background:#fff;border-radius:12px;padding:18px;margin-top:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .section-head h3{margin:0;font-size:15px}

  .toggle-btn{
    border:1px solid var(--border);background:#fff;color:#64748b;
    padding:4px 10px;border-radius:6px;font:inherit;font-size:12px;
    cursor:pointer;transition:all .15s;
  }
  .toggle-btn:hover{border-color:var(--primary);color:var(--primary)}

  .legend{display:flex;gap:14px;font-size:12px;color:#64748b;margin-bottom:10px;flex-wrap:wrap}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
  .legend .dot.ok{background:#16a34a}
  .legend .dot.bad{background:#dc2626}
  .legend .dot.miss{background:#94a3b8}

  /* ===== 紧凑答案网格 ===== */
  .answer-grid{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:4px;
    padding:4px 0;
  }
  .answer-cell{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:4px 2px;border-radius:6px;background:#f1f5f9;
    min-height:38px;
  }
  .answer-cell .idx{font-size:10px;color:#64748b;line-height:1.2}
  .answer-cell .ans{font-size:14px;font-weight:700;line-height:1.2;color:#334155}
  .answer-cell.ok{background:#dcfce7}
  .answer-cell.ok .ans{color:#16a34a}
  .answer-cell.bad{background:#fee2e2}
  .answer-cell.bad .ans{color:#dc2626}
  .answer-cell.miss{background:#f8fafc;border:1px dashed #cbd5e1}
  .answer-cell.miss .ans{color:#94a3b8}

  .result-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .result-actions .btn{flex:1 1 120px}
  .btn{
    border:0;padding:12px;border-radius:10px;
    font:inherit;font-size:14px;font-weight:600;
    cursor:pointer;transition:all .15s;
  }
  .btn.primary{background:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-dark)}
  .btn.secondary{background:#fff;color:#374151;border:1.5px solid var(--border)}
  .btn.secondary:hover{border-color:var(--primary);color:var(--primary)}

  /* ===== 右侧悬浮按钮 ===== */
  .fab{
    position:fixed;right:0;top:50%;transform:translateY(-50%);
    background:var(--primary);color:#fff;border:0;
    border-radius:12px 0 0 12px;
    padding:14px 10px;cursor:pointer;
    box-shadow:-2px 2px 12px rgba(37,99,235,.35);
    z-index:200;font:inherit;font-size:13px;font-weight:600;
    writing-mode:vertical-rl;letter-spacing:3px;
    transition:background .15s;
  }
  .fab:hover{background:var(--primary-dark)}

  /* ===== 答案弹窗 ===== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.5);
    z-index:300;display:flex;align-items:center;justify-content:center;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  }
  .modal{
    background:#fff;border-radius:14px;
    width:100%;max-width:560px;max-height:82vh;max-height:82dvh;
    display:flex;flex-direction:column;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
    animation:modalIn .2s ease;
  }
  @keyframes modalIn{
    from{opacity:0;transform:scale(.96)}
    to{opacity:1;transform:scale(1)}
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .modal-head h3{margin:0;font-size:16px}
  .modal-close{
    border:0;background:transparent;font-size:24px;line-height:1;
    color:var(--muted);cursor:pointer;padding:0;
    width:40px;height:40px;margin:-8px -8px -8px 0;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
  }
  .modal-close:hover{color:#111}
  .modal-close:active{background:#f1f5f9}
  .modal-body{
    overflow-y:auto;flex:1;
    padding:12px 14px;
  }

  /* ===== 手机端 ===== */
  @media (max-width:600px){
    body{font-size:14px}
    .topbar-inner{padding:8px 12px;gap:8px}
    .brand-title{font-size:14px}
    .brand-sub{display:none}
    .progress-bar{width:70px}
    .container{padding:14px 12px calc(90px + env(safe-area-inset-bottom))}
    .q-card{padding:16px;border-radius:12px}
    .q-stem{font-size:15px}
    .option{font-size:14px;padding:13px 12px;border-radius:10px}
    .opt-letter{flex:0 0 24px;height:24px}
    .nav-bar{gap:8px}
    .nav-btn{padding:11px 14px;font-size:13px;min-height:44px}
    .score-num{font-size:46px}
    .result-stats{gap:22px}
    .modal{max-height:86vh;max-height:86dvh;border-radius:16px}
    .modal-body{padding-bottom:calc(16px + env(safe-area-inset-bottom))}

    .fab{
      top:auto;bottom:calc(20px + env(safe-area-inset-bottom));right:16px;transform:none;
      border-radius:50%;width:56px;height:56px;padding:0;
      writing-mode:horizontal-tb;letter-spacing:0;font-size:12px;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 14px rgba(37,99,235,.4);
    }

    .answer-grid{grid-template-columns:repeat(5,1fr);gap:3px}
    .answer-cell{min-height:36px;padding:4px 1px}
    .answer-cell .ans{font-size:13px}
    .answer-cell .idx{font-size:9px}
  }
  /* 横屏小高度：同样使用右下角圆形按钮，避免遮挡内容 */
  @media (max-height:520px) and (orientation:landscape){
    .fab{
      top:auto;bottom:calc(16px + env(safe-area-inset-bottom));right:16px;transform:none;
      border-radius:50%;width:52px;height:52px;padding:0;
      writing-mode:horizontal-tb;letter-spacing:0;font-size:11px;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 14px rgba(37,99,235,.4);
    }
    .container{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  }
  @media (max-width:380px){
    .answer-grid{grid-template-columns:repeat(4,1fr)}
  }
</style>

<script>
/* =========================================================
   题库：系统架构设计师 第2章 计算机系统基础知识（综合知识 · 单选题）
   ========================================================= */
const QUESTIONS = [
  { stem:'计算机系统通常由（　）两部分组成。',
    options:['主机和外部设备','系统软件和应用软件','处理器和存储器','硬件子系统和软件子系统'], answer:3,
    analysis:'计算机系统通常指由硬件子系统和软件子系统组成的系统。硬件由机械、电子元器件、磁介质和光介质等物理实体构成；软件是一系列按照特定顺序组织的数据和指令，用于控制硬件完成指定功能。' },
  { stem:'关于计算机硬件与软件的关系，下列说法正确的是（　）。',
    options:['硬件有形、软件无形，二者的界限始终清晰不变','随着技术发展，硬件与软件的界限逐渐模糊，同一功能既可由硬件实现，也可由软件实现','可编程逻辑在设计阶段是硬件，在运行中是软件','软件功能只能由软件实现，不能由硬件实现'], answer:1,
    analysis:'从存在形式看，硬件有形、软件无形；从功能看，硬件与软件的界限正逐渐模糊。例如可编程逻辑在设计阶段可作为软件对待，运行中则以逻辑门的物理形态存在。' },
  { stem:'冯·诺依曼计算机结构将硬件划分为五部分，下列不属于这五部分的是（　）。',
    options:['运算器','控制器','总线','输入设备和输出设备'], answer:2,
    analysis:'冯·诺依曼结构将硬件划分为运算器、控制器、存储器、输入设备和输出设备五部分。现实中控制单元和运算单元被集成为处理器，输入输出设备常集成为一体，并按传输过程划分为总线、接口和外部设备。' },
  { stem:'下列关于处理器指令集的表述，错误的是（　）。',
    options:['CISC以Intel、AMD的x86 CPU为代表','RISC以ARM和Power为代表','RISC已成为计算机指令集发展的趋势','后期出现的指令集大多采用CISC架构'], answer:3,
    analysis:'除因历史原因仍然存在的CISC结构外，RISC已经成为计算机指令集发展的趋势，几乎所有后期出现的指令集均为RISC架构。' },
  { stem:'具有数百或数千个内核、经过优化可并行运行大量计算，因而在深度学习和机器学习领域得到广泛应用的处理器是（　）。',
    options:['DSP','FPGA','MCU','GPU'], answer:3,
    analysis:'GPU是一种特殊类型的处理器，具有数百或数千个内核，可并行运行大量计算。DSP专用于实时数字信号处理；FPGA是现场可编程逻辑门阵列。' },
  { stem:'计算机存储器分层体系中，通常采用DRAM结构、以独立部件或芯片存在、通过总线与处理器连接的是（　）。',
    options:['片上缓存','片外缓存','主存','外存'], answer:2,
    analysis:'片上缓存一般为SRAM结构，容量16kB~512kB；片外缓存一般也是SRAM，容量256kB~4MB；主存通常采用DRAM结构，容量数百MB至数十GB；外存包括磁带、磁盘、光盘和各类Flash等。' },
  { stem:'按照总线在计算机中所处的位置，总线可分为（　）。',
    options:['数据总线、地址总线和控制总线','并行总线和串行总线','内总线、系统总线和外部总线','同步总线和异步总线'], answer:2,
    analysis:'按位置划分，总线分为内总线（片上总线）、系统总线和外部总线（通信总线）。按传输方式可分为并行总线和串行总线。' },
  { stem:'总线之间通过（　）实现连接，它是一种特殊的外设，主要实现总线协议间的转换。',
    options:['接口','桥','控制器','适配器'], answer:1,
    analysis:'总线之间通过桥（Bridge）实现连接。桥是一种特殊外设，主要实现总线协议间的转换。' },
  { stem:'下列软件中，属于系统软件的是（　）。',
    options:['财务软件','游戏软件','数据库管理系统','图形图像处理软件'], answer:2,
    analysis:'系统软件是为整个计算机系统配置的、不依赖特定应用领域的通用软件，包括操作系统、程序设计语言翻译系统、数据库管理系统和网络软件等。财务、游戏、图形图像处理软件属于应用软件。' },
  { stem:'操作系统的特征不包括（　）。',
    options:['并发性','共享性','虚拟性','一致性'], answer:3,
    analysis:'操作系统具有并发性、共享性、虚拟性和不确定性四个特征。并发性指一段时间内宏观上有多个程序同时运行，单CPU环境下微观上交替执行。' },
  { stem:'将CPU工作时间划分为许多很短的时间片，轮流为各个终端用户服务，具有多路性、独立性、交互性和及时性特点的操作系统是（　）。',
    options:['批处理操作系统','分时操作系统','实时操作系统','嵌入式操作系统'], answer:1,
    analysis:'分时操作系统将CPU时间划分为许多很短的时间片，轮流为各终端用户服务。其主要特点为多路性、独立性、交互性和及时性。' },
  { stem:'飞机订票系统、情报检索系统属于（　）。',
    options:['实时控制系统','分时系统','实时信息处理系统','批处理系统'], answer:2,
    analysis:'实时系统分为实时控制系统和实时信息处理系统。实时控制系统主要用于生产过程自动控制，如数据自动采集、武器控制、飞机自动驾驶、导弹制导等；实时信息处理系统如飞机订票系统、情报检索系统等。' },

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuestion() {
  const i = state.currentIndex;
  const q = quizQuestions[i];
  const ans = state.answers[i];
  const answered = ans !== null;
  const total = quizQuestions.length;

  const optionsHTML = q.options.map((text, j) => {
    let cls = 'option';
    if (answered) {
      if (j === q.answer) cls += ' correct';
      else if (j === ans) cls += ' wrong';
    }
    return `<button class="${cls}" data-o="${j}" type="button">
              <span class="opt-letter">${LETTERS[j]}</span>
              <span class="opt-text">${text}</span>
            </button>`;
  }).join('');

  let feedback = '';
  if (answered) {
    const isCorrect = ans === q.answer;
    feedback = `
      <div class="feedback ${isCorrect ? 'ok' : 'bad'}">
        <div class="feedback-title">${isCorrect ? '✅ 回答正确' : '❌ 回答错误　正确答案：' + LETTERS[q.answer]}</div>
        <div class="feedback-analysis">${q.analysis}</div>
      </div>`;
  }

  const card = $('#qCard');
  card.innerHTML = `
    <div class="q-head">
      <span class="q-badge">第 ${i + 1} 题</span>
      <span class="q-tag">单选题</span>
    </div>
    <div class="q-stem">${q.stem}</div>
    <div class="options">${optionsHTML}</div>
    ${feedback}
  `;

  if (i !== lastRenderedIndex) {
    card.classList.remove('anim');
    void card.offsetWidth;
    card.classList.add('anim');
    lastRenderedIndex = i;
  }

  $('#navIndex').textContent = `${i + 1} / ${total}`;
  $('#prevBtn').disabled = (i === 0);
  const nextBtn = $('#nextBtn');
  nextBtn.textContent = (i === total - 1) ? '完成 ✓' : '下一题 →';
}

/* =========================================================
   渲染：进度
   ========================================================= */
function renderProgress() {
  const total = quizQuestions.length;
  const answered = state.answers.filter(a => a !== null).length;
  $('#progressFill').style.width = (answered / total * 100) + '%';
  $('#progressText').textContent = `已答 ${answered}/${total}`;
}

/* =========================================================
   渲染：结果页
   ========================================================= */
function renderResult() {
  const total = quizQuestions.length;
  let correct = 0, wrong = 0, unanswered = 0;
  const wrongList = [];

  quizQuestions.forEach((q, i) => {
    const a = state.answers[i];
    if (a === null) { unanswered++; wrongList.push(i); }
    else if (a === q.answer) { correct++; }
    else { wrong++; wrongList.push(i); }
  });

  const score = Math.round(correct / total * 100);
  let level = '需加强';
  if (score >= 85) level = '优秀';
  else if (score >= 70) level = '良好';
  else if (score >= 60) level = '及格';

  const indicesToShow = showOnlyWrong ? wrongList : quizQuestions.map((_, i) => i);
  const cellsHTML = indicesToShow.map(i => {
    const q = quizQuestions[i];
    const a = state.answers[i];
    let cls = 'answer-cell';
    let ansText;
    if (a === null) { cls += ' miss'; ansText = '—'; }
    else if (a === q.answer) { cls += ' ok'; ansText = LETTERS[a]; }
    else { cls += ' bad'; ansText = LETTERS[a]; }
    return `<div class="${cls}">
      <span class="idx">${i + 1}</span>
      <span class="ans">${ansText}</span>
    </div>`;
  }).join('');

  let toggleBtnHTML = '';
  if (!isReviewingWrong && wrongList.length > 0) {
    toggleBtnHTML = `<button class="toggle-btn" id="toggleWrongBtn" type="button">${showOnlyWrong ? '显示全部' : '只看错题'}</button>`;
  }

  let actionButtons = '';
  if (isReviewingWrong) {
    actionButtons = `
      <button class="btn secondary" id="backToFullBtn" type="button">返回完整成绩</button>
      <button class="btn primary" id="restartBtn" type="button">重新开始全部</button>
    `;
  } else {
    actionButtons = `
      <button class="btn secondary" id="viewAnswersBtn" type="button">查看全部正确答案</button>
      ${wrongList.length > 0 ? '<button class="btn secondary" id="startWrongBtn" type="button">重做错题</button>' : ''}
      <button class="btn primary" id="restartBtn" type="button">重新开始</button>
    `;
  }

  $('#resultView').innerHTML = `
    <div class="result-card">
      <div class="score-ring">
        <span class="score-num">${score}</span>
        <span class="score-unit">分</span>
      </div>
      <div class="result-level">${level}${isReviewingWrong ? '（错题重做）' : ''}</div>
      <div class="result-stats">
        <div class="stat"><span class="stat-num ok">${correct}</span><span class="stat-label">正确</span></div>
        <div class="stat"><span class="stat-num bad">${wrong}</span><span class="stat-label">错误</span></div>
        <div class="stat"><span class="stat-num muted">${unanswered}</span><span class="stat-label">未答</span></div>
      </div>
    </div>

    <div class="result-section">
      <div class="section-head">
        <h3>${isReviewingWrong ? '本次错题明细' : '答题明细'}</h3>
        ${toggleBtnHTML}
      </div>
      <div class="legend">
        <span><i class="dot ok"></i>正确</span>
        <span><i class="dot bad"></i>错误</span>
        <span><i class="dot miss"></i>未答</span>
      </div>
      <div class="answer-grid">${cellsHTML || '<p style="color:#94a3b8;font-size:13px;margin:0;">暂无数据</p>'}</div>
    </div>

    <div class="result-actions">${actionButtons}</div>
  `;
}

/* =========================================================
   渲染：全部正确答案弹窗
   ========================================================= */
function renderAnswerGrid() {
  const cells = quizQuestions.map((q, i) => `
    <div class="answer-cell">
      <span class="idx">${i + 1}</span>
      <span class="ans">${LETTERS[q.answer]}</span>
    </div>
  `).join('');
  $('#answerGrid').innerHTML = cells;
}

/* =========================================================
   答题交互
   ========================================================= */
function onOptionClick(e) {
  const btn = e.target.closest('.option');
  if (!btn) return;

  const i = state.currentIndex;
  const oi = Number(btn.dataset.o);
  const firstTime = state.answers[i] === null;
  const total = quizQuestions.length;

  state.answers[i] = oi;
  renderQuestion();
  renderProgress();

  if (firstTime) {
    const isPhone = window.matchMedia('(max-width:600px)').matches;
    if (isPhone) {
      /* 手机端不自动跳题：先让用户看完解析，再手动点“下一题” */
      const fb = document.querySelector('#qCard .feedback');
      if (fb) fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    } else {
      setTimeout(() => {
        if (state.finished) return;
        if (state.currentIndex !== i) return;
        if (i < total - 1) {
          state.currentIndex = i + 1;
          renderQuestion();
          renderProgress();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          finish();
        }
      }, 1000);
    }
  }
}

function goPrev() {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    renderQuestion();
    renderProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function goNext() {
  if (state.currentIndex < quizQuestions.length - 1) {
    state.currentIndex++;
    renderQuestion();
    renderProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    finish();
  }
}

function finish() {
  state.finished = true;
  renderResult();
  $('#quizView').classList.add('hidden');
  $('#resultView').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  isReviewingWrong = false;
  showOnlyWrong = false;
  savedQuizState = null;
  quizQuestions = shuffleArray(QUESTIONS);
  state.answers = new Array(quizQuestions.length).fill(null);
  state.currentIndex = 0;
  state.finished = false;
  lastRenderedIndex = -1;

  $('#resultView').classList.add('hidden');
  $('#resultView').innerHTML = '';
  $('#quizView').classList.remove('hidden');

  renderQuestion();
  renderProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   错题重做
   ========================================================= */
function startWrongReview() {
  const wrongQuestions = quizQuestions.filter((q, i) => state.answers[i] !== q.answer);
  if (wrongQuestions.length === 0) {
    alert('没有错题需要重做！');
    return;
  }

  savedQuizState = {
    quizQuestions: [...quizQuestions],
    answers: [...state.answers],
    currentIndex: state.currentIndex,
    finished: state.finished
  };

  isReviewingWrong = true;
  showOnlyWrong = false;
  quizQuestions = wrongQuestions;
  state.answers = new Array(wrongQuestions.length).fill(null);
  state.currentIndex = 0;
  state.finished = false;
  lastRenderedIndex = -1;

  $('#resultView').classList.add('hidden');
  $('#resultView').innerHTML = '';
  $('#quizView').classList.remove('hidden');
  renderQuestion();
  renderProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function backToFullResult() {
  if (!savedQuizState) return;

  isReviewingWrong = false;
  showOnlyWrong = false;
  quizQuestions = savedQuizState.quizQuestions;
  state.answers = savedQuizState.answers;
  state.currentIndex = savedQuizState.currentIndex;
  state.finished = savedQuizState.finished;
  savedQuizState = null;

  $('#quizView').classList.add('hidden');
  $('#resultView').classList.remove('hidden');
  renderResult();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   结果页点击
   ========================================================= */
function onResultClick(e) {
  if (e.target.id === 'restartBtn') { restart(); return; }
  if (e.target.id === 'viewAnswersBtn') { openAnswerModal(); return; }
  if (e.target.id === 'toggleWrongBtn') {
    showOnlyWrong = !showOnlyWrong;
    renderResult();
    return;
  }
  if (e.target.id === 'startWrongBtn') {
    startWrongReview();
    return;
  }
  if (e.target.id === 'backToFullBtn') {
    backToFullResult();
    return;
  }
}

/* =========================================================
   答案弹窗
   ========================================================= */
function openAnswerModal() {
  renderAnswerGrid();
  $('#answerModal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeAnswerModal() {
  $('#answerModal').classList.add('hidden');
  document.body.style.overflow = '';
}

/* =========================================================
   初始化
   ========================================================= */
document.addEventListener('DOMContentLoaded', () => {
  quizQuestions = shuffleArray(QUESTIONS);
  state.answers = new Array(quizQuestions.length).fill(null);
  renderQuestion();
  renderProgress();

  $('#qCard').addEventListener('click', onOptionClick);
  $('#prevBtn').addEventListener('click', goPrev);
  $('#nextBtn').addEventListener('click', goNext);
  $('#resultView').addEventListener('click', onResultClick);

  $('#fabBtn').addEventListener('click', openAnswerModal);
  $('#modalClose').addEventListener('click', closeAnswerModal);
  $('#answerModal').addEventListener('click', (e) => {
    if (e.target === $('#answerModal')) closeAnswerModal();
  });
});
</script>
